<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Image to PDF</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f8;
color:#222;
}

.container{
width:94%;
max-width:900px;
margin:25px auto;
}

header{
text-align:center;
margin-bottom:25px;
}

h1{
margin:0 0 8px;
font-size:32px;
}

.subtitle{
color:#666;
margin:0;
}

.upload{
background:white;
border:2px dashed #aaa;
border-radius:14px;
padding:35px 20px;
text-align:center;
cursor:pointer;
display:block;
}

.upload:hover{
border-color:#222;
}

.upload-icon{
font-size:40px;
display:block;
margin-bottom:10px;
}

.upload small{
display:block;
color:#777;
margin-top:6px;
}

input[type=file]{
display:none;
}

.section{
background:white;
padding:20px;
border-radius:14px;
margin-top:18px;
box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.section h2{
margin-top:0;
font-size:20px;
}

#preview{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
gap:15px;
}

.card{
position:relative;
background:#f8f8f8;
border:1px solid #ddd;
border-radius:12px;
padding:8px;
cursor:grab;
}

.card.dragging{
opacity:.5;
}

.card img{
width:100%;
height:150px;
object-fit:contain;
border-radius:8px;
background:#eee;
transition:.2s;
}

.number{
position:absolute;
top:12px;
left:12px;
background:#222;
color:white;
width:26px;
height:26px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:13px;
z-index:3;
}

.controls{
display:flex;
gap:5px;
margin-top:8px;
}

.controls button{
flex:1;
padding:8px 3px;
font-size:13px;
border:0;
border-radius:7px;
cursor:pointer;
background:#ddd;
}

.controls button:hover{
background:#ccc;
}

.remove{
background:#f04444!important;
color:white;
}

.editor{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

label{
font-weight:bold;
font-size:14px;
}

select,
input[type=text],
input[type=number]{
width:100%;
padding:11px;
margin-top:6px;
border:1px solid #ccc;
border-radius:8px;
background:white;
}

.range{
width:100%;
}

.checkbox{
display:flex;
gap:8px;
align-items:center;
font-weight:normal;
margin-top:15px;
}

button.main{
width:100%;
padding:15px;
border:0;
border-radius:10px;
background:#222;
color:white;
font-size:17px;
cursor:pointer;
margin-top:20px;
}

button.main:hover{
background:#444;
}

#status{
text-align:center;
margin-top:15px;
font-weight:bold;
}

.empty{
text-align:center;
color:#777;
padding:20px;
grid-column:1/-1;
}

@media(max-width:600px){

.container{
width:95%;
}

h1{
font-size:27px;
}

.editor{
grid-template-columns:1fr;
}

#preview{
grid-template-columns:repeat(2,1fr);
}

.card img{
height:130px;
}

}

</style>

</head>

<body>

<div class="container">

<header>

<h1>📄 Image to PDF</h1>

<p class="subtitle">
Edit your images, arrange them and create a PDF
</p>

</header>


<label class="upload">

<span class="upload-icon">📁</span>

<strong>Add Images</strong>

<small>
JPG • PNG • WEBP — Multiple images supported
</small>

<input
type="file"
id="images"
accept="image/*"
multiple
>

</label>


<div class="section">

<h2>🖼️ Your Images</h2>

<p style="color:#777;font-size:13px">
Drag images to change their order
</p>

<div id="preview">

<div class="empty">
No images selected yet
</div>

</div>

</div>


<div class="section">

<h2>✏️ Image Editing</h2>

<div class="editor">

<div>

<label>Brightness</label>

<input
class="range"
id="brightness"
type="range"
min="50"
max="150"
value="100"
>

</div>


<div>

<label>Contrast</label>

<input
class="range"
id="contrast"
type="range"
min="50"
max="150"
value="100"
>

</div>

</div>

<p style="font-size:13px;color:#777">
Select an image above, then use the controls on it.
Brightness and contrast apply to the selected image.
</p>

</div>


<div class="section">

<h2>📄 PDF Settings</h2>

<div class="editor">

<div>

<label>Page Size</label>

<select id="pageSize">

<option value="A4">A4</option>
<option value="A3">A3</option>
<option value="LETTER">Letter</option>
<option value="LEGAL">Legal</option>

</select>

</div>


<div>

<label>Orientation</label>

<select id="orientation">

<option value="portrait">Portrait</option>
<option value="landscape">Landscape</option>

</select>

</div>


<div>

<label>Image Fit</label>

<select id="fit">

<option value="fit">Fit to Page</option>
<option value="fill">Fill Page</option>
<option value="original">Original Size</option>

</select>

</div>


<div>

<label>Images Per Page</label>

<select id="perPage">

<option value="1">1 Image</option>
<option value="2">2 Images</option>
<option value="4">4 Images</option>

</select>

</div>


<div>

<label>Margins</label>

<select id="margin">

<option value="15">Small</option>
<option value="30" selected>Normal</option>
<option value="50">Large</option>

</select>

</div>


<div>

<label>Quality</label>

<select id="quality">

<option value="95">High</option>
<option value="85" selected>Medium</option>
<option value="65">Low / Small PDF</option>

</select>

</div>

</div>


<label class="checkbox">

<input type="checkbox" id="pageNumbers">

Add page numbers

</label>


<div style="margin-top:15px">

<label>Watermark (optional)</label>

<input
type="text"
id="watermark"
placeholder="e.g. CONFIDENTIAL"
>

</div>


<div style="margin-top:15px">

<label>PDF Filename</label>

<input
type="text"
id="filename"
value="images.pdf"
>

</div>

</div>


<form
id="form"
action="/convert"
method="POST"
enctype="multipart/form-data"
>

<input
type="hidden"
name="settings"
id="settings"
>

<button
class="main"
type="submit"
>
⬇️ Create PDF
</button>

</form>


<div id="status"></div>

</div>


<script>

const input =
document.getElementById("images");

const preview =
document.getElementById("preview");

let files = [];

let selected = -1;

let data = [];


input.addEventListener("change",function(){

files = Array.from(input.files);

data = files.map(function(){

return {
rotation:0,
flipH:false,
flipV:false,
gray:false,
brightness:100,
contrast:100,
crop:false
};

});

if(files.length > 0){

selected = 0;

}

render();

});


function render(){

preview.innerHTML="";

if(files.length===0){

preview.innerHTML =
'<div class="empty">No images selected yet</div>';

return;

}

files.forEach(function(file,index){

const card =
document.createElement("div");

card.className="card";

card.draggable=true;

if(index===selected){

card.style.border="2px solid #222";

}


card.ondragstart=function(e){

e.dataTransfer.setData(
"text/plain",
index
);

card.classList.add("dragging");

};


card.ondragend=function(){

card.classList.remove("dragging");

};


card.ondragover=function(e){

e.preventDefault();

};


card.ondrop=function(e){

e.preventDefault();

const from =
Number(e.dataTransfer.getData("text/plain"));

const to=index;

if(from===to)return;

const f=files.splice(from,1)[0];

const d=data.splice(from,1)[0];

files.splice(to,0,f);

data.splice(to,0,d);

if(selected===from){

selected=to;

}

render();

};


const number =
document.createElement("div");

number.className="number";

number.textContent=index+1;


const img =
document.createElement("img");

img.src =
URL.createObjectURL(file);

const d=data[index];

let transform =
"rotate("+d.rotation+"deg)";

if(d.flipH)
transform+=" scaleX(-1)";

if(d.flipV)
transform+=" scaleY(-1)";

img.style.transform=transform;

let filter="";

if(d.gray)
filter+=" grayscale(100%)";

filter+=
" brightness("+d.brightness+"%)";

filter+=
" contrast("+d.contrast+"%)";

img.style.filter=filter;


card.onclick=function(){

selected=index;

loadEditor();

render();

};


const controls =
document.createElement("div");

controls.className="controls";


function button(text,fn,cls){

const b =
document.createElement("button");

b.type="button";

b.textContent=text;

b.onclick=function(e){

e.stopPropagation();

fn();

};

if(cls)b.className=cls;

controls.appendChild(b);

}


button("↺",function(){

d.rotation=
(d.rotation+90)%360;

render();

});


button("↔",function(){

d.flipH=!d.flipH;

render();

});


button("↕",function(){

d.flipV=!d.flipV;

render();

});


button("B/W",function(){

d.gray=!d.gray;

render();

});


button("✕",function(){

files.splice(index,1);

data.splice(index,1);

if(files.length===0){

selected=-1;

}else if(selected>=files.length){

selected=files.length-1;

}

render();

},"remove");


card.appendChild(number);

card.appendChild(img);

card.appendChild(controls);

preview.appendChild(card);

});

}


const brightness =
document.getElementById("brightness");

const contrast =
document.getElementById("contrast");


function loadEditor(){

if(selected<0)return;

brightness.value=
data[selected].brightness;

contrast.value=
data[selected].contrast;

}


brightness.addEventListener("input",function(){

if(selected<0)return;

data[selected].brightness=
Number(this.value);

render();

});


contrast.addEventListener("input",function(){

if(selected<0)return;

data[selected].contrast=
Number(this.value);

render();

});


document
.getElementById("form")
.addEventListener("submit",function(e){

if(files.length===0){

e.preventDefault();

alert("Please select at least one image.");

return;

}

document
.getElementById("settings")
.value=
JSON.stringify({

pageSize:
document.getElementById("pageSize").value,

orientation:
document.getElementById("orientation").value,

fit:
document.getElementById("fit").value,

perPage:
document.getElementById("perPage").value,

margin:
document.getElementById("margin").value,

quality:
document.getElementById("quality").value,

pageNumbers:
document.getElementById("pageNumbers").checked,

watermark:
document.getElementById("watermark").value,

filename:
document.getElementById("filename").value

});


/*
Create edited image files before sending.
*/

const dt=new DataTransfer();

const promises=[];


files.forEach(function(file,index){

const promise=new Promise(function(resolve){

const img=new Image();

img.onload=function(){

const d=data[index];

const canvas=
document.createElement("canvas");

const ctx=
canvas.getContext("2d");

let w=img.width;

let h=img.height;


/* Center crop */

if(d.crop){

const size=Math.min(w,h);

const sx=(w-size)/2;

const sy=(h-size)/2;

canvas.width=size;

canvas.height=size;

ctx.drawImage(
img,
sx,sy,size,size,
0,0,size,size
);

}else{

canvas.width=w;

canvas.height=h;

ctx.drawImage(img,0,0);

}


/* Transformations */

let imageData=
ctx.getImageData(
0,
0,
canvas.width,
canvas.height
);

if(d.gray){

for(
let i=0;
i<imageData.data.length;
i+=4
){

const avg=
0.299*imageData.data[i]+
0.587*imageData.data[i+1]+
0.114*imageData.data[i+2];

imageData.data[i]=avg;
imageData.data[i+1]=avg;
imageData.data[i+2]=avg;

}

ctx.putImageData(
imageData,
0,
0
);

}


/* Brightness */

if(d.brightness!==100){

const imgData=
ctx.getImageData(
0,
0,
canvas.width,
canvas.height
);

const factor=
d.brightness/100;

for(
let i=0;
i<imgData.data.length;
i+=4
){

imgData.data[i]=
Math.min(
255,
imgData.data[i]*factor
);

imgData.data[i+1]=
Math.min(
255,
imgData.data[i+1]*factor
);

imgData.data[i+2]=
Math.min(
255,
imgData.data[i+2]*factor
);

}

ctx.putImageData(
imgData,
0,
0
);

}


canvas.toBlob(function(blob){

resolve(
new File(
[blob],
file.name,
{
type:"image/jpeg"
}
)
);

},"image/jpeg",.92);

};

img.src=
URL.createObjectURL(file);

});

promises.push(promise);

});


Promise.all(promises).then(function(result){

result.forEach(function(file){

dt.items.add(file);

});

input.files=dt.files;

});

});


render();

</script>

</body>
</html>
